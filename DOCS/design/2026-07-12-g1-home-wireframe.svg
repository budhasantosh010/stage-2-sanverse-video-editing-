<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Stage 2 Sanverse Home — G1 low-fidelity wireframe</title>
  <desc id="desc">A calm black-and-white landing screen with one central conversational upload composer and recent video projects.</desc>
  <defs>
    <style>
      .bg { fill: #f6f6f3; }
      .surface { fill: #ffffff; stroke: #171717; stroke-width: 1.4; }
      .soft { fill: #ececea; }
      .ink { fill: #111111; }
      .muted { fill: #6b6b68; }
      .quiet { stroke: #d2d2ce; stroke-width: 1; fill: none; }
      .brand { font: 700 22px Georgia, serif; fill: #111111; }
      .display { font: 700 54px Georgia, serif; fill: #111111; text-anchor: middle; }
      .h2 { font: 700 19px Arial, sans-serif; fill: #111111; }
      .body { font: 400 15px Arial, sans-serif; fill: #111111; }
      .small { font: 400 12px Arial, sans-serif; fill: #6b6b68; }
      .label { font: 700 11px Arial, sans-serif; letter-spacing: 1.3px; fill: #6b6b68; }
      .button { fill: #111111; stroke: #111111; }
      .buttonText { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <!-- Minimal application chrome -->
  <rect x="0" y="0" width="1600" height="70" fill="#ffffff"/>
  <line class="quiet" x1="0" y1="70" x2="1600" y2="70"/>
  <circle class="ink" cx="34" cy="35" r="15"/>
  <path d="M29 27 L42 35 L29 43 Z" fill="#ffffff"/>
  <text class="brand" x="61" y="42">Sanverse</text>
  <text class="body muted" x="1338" y="41">Projects</text>
  <circle cx="1454" cy="35" r="17" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
  <text x="1454" y="40" style="font:700 13px Arial,sans-serif;fill:#111;text-anchor:middle">?</text>
  <circle cx="1516" cy="35" r="18" fill="#deded9"/>
  <text x="1516" y="40" style="font:700 12px Arial,sans-serif;fill:#111;text-anchor:middle">SB</text>

  <!-- Quiet rail: navigation, not editing tools -->
  <rect x="0" y="70" width="70" height="930" fill="#ffffff"/>
  <line class="quiet" x1="70" y1="70" x2="70" y2="1000"/>
  <rect x="15" y="100" width="40" height="40" rx="11" fill="#111111"/>
  <path d="M26 122 L35 114 L44 122 V132 H38 V125 H32 V132 H26 Z" fill="#ffffff"/>
  <rect x="15" y="153" width="40" height="40" rx="11" fill="#ffffff"/>
  <rect x="25" y="166" width="20" height="15" rx="2" fill="none" stroke="#666" stroke-width="1.6"/>
  <path d="M28 166 V162 H36 L39 166" fill="none" stroke="#666" stroke-width="1.6"/>
  <circle cx="35" cy="950" r="16" fill="#ffffff" stroke="#90908b" stroke-width="1.2"/>
  <text x="35" y="955" style="font:700 12px Arial,sans-serif;fill:#555;text-anchor:middle">?</text>

  <!-- Screen label -->
  <text class="label" x="112" y="116">SCREEN 1 · HOME · FIRST ARRIVAL</text>

  <!-- Central conversational start -->
  <circle class="ink" cx="800" cy="185" r="17"/>
  <path d="M794 176 L808 185 L794 194 Z" fill="#ffffff"/>
  <text class="brand" x="829" y="192">Sanverse</text>

  <text class="display" x="800" y="276">What do you want to edit today?</text>
  <text x="800" y="318" style="font:400 17px Arial,sans-serif;fill:#6b6b68;text-anchor:middle">Drop a cleaned video, describe the result, and review every change before it happens.</text>

  <!-- Composer -->
  <rect class="surface" x="390" y="360" width="820" height="184" rx="18"/>
  <text x="420" y="404" style="font:400 17px Arial,sans-serif;fill:#8a8a86">Describe the edit you want, or drop a video here…</text>

  <circle cx="430" cy="501" r="19" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
  <path d="M430 492 V510 M421 501 H439" stroke="#111111" stroke-width="1.7" stroke-linecap="round"/>

  <rect x="463" y="482" width="118" height="38" rx="19" fill="#f1f1ee" stroke="#d0d0cc" stroke-width="1"/>
  <rect x="480" y="492" width="18" height="14" rx="2" fill="none" stroke="#555" stroke-width="1.3"/>
  <path d="M484 496 L489 501 L493 498 L497 503" fill="none" stroke="#555" stroke-width="1.2"/>
  <text class="body" x="508" y="506">Video</text>

  <text class="small" x="598" y="506">MP4 · drag anywhere</text>

  <rect class="button" x="1018" y="480" width="164" height="42" rx="21"/>
  <text class="buttonText" x="1048" y="506">Start editing</text>
  <path d="M1158 495 L1166 501 L1158 507" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="800" y="578" style="font:400 13px Arial,sans-serif;fill:#777773;text-anchor:middle">or drop a cleaned video anywhere on this page</text>

  <!-- Recent projects -->
  <text class="h2" x="250" y="662">Recent projects</text>
  <text class="body muted" x="1258" y="662">View all</text>
  <path d="M1311 656 L1317 662 L1311 668" fill="none" stroke="#777" stroke-width="1.3"/>

  <g>
    <rect class="surface" x="250" y="688" width="330" height="202" rx="14"/>
    <rect x="262" y="700" width="306" height="126" rx="9" fill="#d8d8d3"/>
    <circle cx="415" cy="754" r="29" fill="#a8a8a2"/>
    <path d="M363 826 C372 782 458 782 467 826 Z" fill="#92928c"/>
    <rect x="278" y="714" width="82" height="8" rx="4" fill="#b8b8b2"/>
    <text class="h2" x="270" y="857">Founder introduction</text>
    <text class="small" x="270" y="878">Edited 12 minutes ago · 08:42</text>
  </g>

  <g>
    <rect class="surface" x="600" y="688" width="330" height="202" rx="14"/>
    <rect x="612" y="700" width="306" height="126" rx="9" fill="#cacac5"/>
    <rect x="648" y="724" width="234" height="78" rx="7" fill="#eeeeeb"/>
    <rect x="672" y="742" width="138" height="12" rx="6" fill="#a5a59f"/>
    <rect x="672" y="765" width="94" height="8" rx="4" fill="#b8b8b2"/>
    <text class="h2" x="620" y="857">AI tools explained</text>
    <text class="small" x="620" y="878">Edited yesterday · 11:06</text>
  </g>

  <g>
    <rect class="surface" x="950" y="688" width="330" height="202" rx="14"/>
    <rect x="962" y="700" width="306" height="126" rx="9" fill="#deded9"/>
    <circle cx="1070" cy="758" r="36" fill="#a4a49e"/>
    <rect x="1127" y="729" width="102" height="58" rx="5" fill="#ffffff"/>
    <rect x="1142" y="744" width="70" height="8" rx="4" fill="#a7a7a1"/>
    <rect x="1142" y="761" width="48" height="6" rx="3" fill="#bbbbB5"/>
    <text class="h2" x="970" y="857">Weekly startup update</text>
    <text class="small" x="970" y="878">Edited 4 days ago · 06:18</text>
  </g>

  <text class="small" x="112" y="956">HOME REVEALS ONLY THE STARTING DECISION · EDITING CONTROLS APPEAR AFTER A VIDEO OR PROJECT OPENS</text>
</svg>
