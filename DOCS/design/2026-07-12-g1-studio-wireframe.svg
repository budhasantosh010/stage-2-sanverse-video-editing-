<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Stage 2 Sanverse Studio — G1 low-fidelity wireframe</title>
  <desc id="desc">A black-and-white desktop video editing interface with a central video canvas, a conversational proposal panel, and a simple time strip.</desc>
  <defs>
    <style>
      .bg { fill: #f4f4f2; }
      .surface { fill: #ffffff; stroke: #161616; stroke-width: 1.5; }
      .soft { fill: #ececea; }
      .ink { fill: #111111; }
      .muted { fill: #686868; }
      .line { stroke: #161616; stroke-width: 1.5; fill: none; }
      .quiet-line { stroke: #b8b8b4; stroke-width: 1; fill: none; }
      .dash { stroke: #7b7b77; stroke-width: 1.5; stroke-dasharray: 7 7; fill: none; }
      .brand { font: 700 22px Georgia, serif; fill: #111111; }
      .display { font: 700 34px Georgia, serif; fill: #111111; }
      .h2 { font: 700 18px Arial, sans-serif; fill: #111111; }
      .body { font: 400 15px Arial, sans-serif; fill: #111111; }
      .small { font: 400 12px Arial, sans-serif; fill: #686868; }
      .label { font: 700 11px Arial, sans-serif; letter-spacing: 1.2px; fill: #686868; }
      .button { fill: #111111; stroke: #111111; }
      .button-text { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .ghost-button { fill: #ffffff; stroke: #161616; stroke-width: 1.2; }
      .number { fill: #111111; }
      .number-text { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text class="label" x="72" y="58">G1 LOW-FIDELITY WIREFRAME · PROPOSAL REVIEW STATE</text>
  <text class="display" x="72" y="102">The editing room without the editor learning curve.</text>
  <text class="body muted" x="72" y="132">One canvas, one conversation, one trustworthy next action.</text>

  <rect class="surface" x="72" y="170" width="1456" height="708" rx="18"/>

  <!-- Top bar -->
  <line class="quiet-line" x1="72" y1="232" x2="1528" y2="232"/>
  <circle class="ink" cx="106" cy="201" r="15"/>
  <path d="M101 193 L114 201 L101 209 Z" fill="#ffffff"/>
  <text class="brand" x="134" y="208">Sanverse Studio</text>
  <text class="body muted" x="390" y="206">Founder video · saved</text>

  <rect class="ghost-button" x="1226" y="184" width="104" height="34" rx="17"/>
  <text class="body" x="1254" y="206">Undo</text>
  <rect class="button" x="1342" y="184" width="150" height="34" rx="17"/>
  <text class="button-text" x="1382" y="206">Export video</text>

  <!-- Canvas zone -->
  <rect x="96" y="256" width="946" height="490" rx="14" fill="#171717"/>
  <rect x="170" y="294" width="798" height="414" rx="4" fill="#d9d9d5"/>

  <!-- Abstract talking-head frame -->
  <rect x="170" y="294" width="798" height="92" fill="#c9c9c4"/>
  <rect x="170" y="640" width="798" height="68" fill="#bcbcb6"/>
  <circle cx="604" cy="454" r="78" fill="#a1a19a"/>
  <path d="M491 640 C510 544 699 544 718 640 Z" fill="#8a8a84"/>
  <rect x="210" y="333" width="190" height="16" rx="8" fill="#b0b0aa"/>
  <rect x="210" y="358" width="122" height="10" rx="5" fill="#b8b8b2"/>

  <!-- User-selected placement -->
  <rect x="700" y="532" width="222" height="104" rx="8" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="720" y="551" width="184" height="65" rx="5" fill="#ffffff"/>
  <text class="h2" x="738" y="578">Santosh</text>
  <text class="small" x="738" y="599">Founder</text>
  <circle cx="918" cy="530" r="7" fill="#ffffff"/>
  <circle cx="918" cy="638" r="7" fill="#ffffff"/>
  <text x="708" y="521" style="font:700 11px Arial,sans-serif;fill:#ffffff;letter-spacing:1px">YOUR SELECTION</text>

  <!-- Canvas controls -->
  <circle cx="121" cy="706" r="18" fill="#ffffff"/>
  <path d="M116 697 L130 706 L116 715 Z" fill="#111111"/>
  <text x="151" y="711" style="font:400 13px Arial,sans-serif;fill:#ffffff">00:18 / 08:42</text>
  <text x="873" y="711" style="font:400 12px Arial,sans-serif;fill:#ffffff">Fit</text>
  <rect x="910" y="694" width="40" height="24" rx="12" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="1"/>
  <text x="922" y="711" style="font:700 11px Arial,sans-serif;fill:#ffffff">100</text>

  <!-- Conversation panel -->
  <line class="quiet-line" x1="1066" y1="232" x2="1066" y2="746"/>
  <text class="h2" x="1092" y="278">Describe the change</text>
  <text class="small" x="1092" y="301">Point on the video, then use normal language.</text>

  <rect class="soft" x="1092" y="328" width="384" height="76" rx="12"/>
  <text class="small" x="1110" y="351">YOU · 00:18</text>
  <text class="body" x="1110" y="378">Add “Santosh — Founder” here</text>
  <text class="body" x="1110" y="397">for five seconds.</text>

  <text class="label" x="1092" y="445">PROPOSED EDIT</text>
  <rect class="surface" x="1092" y="460" width="384" height="168" rx="12"/>
  <text class="h2" x="1112" y="492">Static nameplate</text>
  <line class="quiet-line" x1="1112" y1="507" x2="1456" y2="507"/>
  <text class="small" x="1112" y="535">WHAT</text>
  <text class="body" x="1180" y="535">Santosh / Founder</text>
  <text class="small" x="1112" y="561">WHERE</text>
  <text class="body" x="1180" y="561">Your selected area</text>
  <text class="small" x="1112" y="587">WHEN</text>
  <text class="body" x="1180" y="587">00:18 → 00:23</text>
  <text class="small" x="1112" y="613">MOTION</text>
  <text class="body" x="1180" y="613">None</text>

  <rect class="ghost-button" x="1092" y="648" width="112" height="42" rx="21"/>
  <text class="body" x="1124" y="674">Revise</text>
  <rect class="button" x="1216" y="648" width="260" height="42" rx="21"/>
  <text class="button-text" x="1299" y="674">Preview change</text>

  <rect class="surface" x="1092" y="704" width="384" height="42" rx="12"/>
  <text class="muted" x="1110" y="730" style="font:400 14px Arial,sans-serif">Ask for a change…</text>
  <circle class="ink" cx="1452" cy="725" r="13"/>
  <path d="M1447 720 L1457 725 L1447 730 Z" fill="#ffffff"/>

  <!-- Simple time strip -->
  <rect x="72" y="746" width="1456" height="132" rx="0 0 18 18" fill="#fafaf9"/>
  <line class="quiet-line" x1="72" y1="746" x2="1528" y2="746"/>
  <text class="label" x="98" y="780">VIDEO</text>
  <rect class="soft" x="170" y="768" width="1170" height="32" rx="6"/>
  <rect x="580" y="768" width="26" height="32" rx="4" fill="#111111"/>
  <text class="small" x="1354" y="789">08:42</text>

  <text class="label" x="98" y="836">EDITS</text>
  <line class="quiet-line" x1="170" y1="826" x2="1340" y2="826"/>
  <rect x="593" y="812" width="46" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="608" y="831" style="font:700 11px Arial,sans-serif;fill:#111111">01</text>
  <line x1="593" y1="758" x2="593" y2="852" stroke="#111111" stroke-width="2"/>
  <text class="small" x="573" y="866">00:18</text>

  <!-- Annotation key -->
  <circle class="number" cx="112" cy="916" r="14"/>
  <text class="number-text" x="112" y="916">1</text>
  <text class="body" x="136" y="921">Canvas first: point and draw where the change belongs.</text>

  <circle class="number" cx="616" cy="916" r="14"/>
  <text class="number-text" x="616" y="916">2</text>
  <text class="body" x="640" y="921">Proposal explains what, where, when, and motion.</text>

  <circle class="number" cx="1122" cy="916" r="14"/>
  <text class="number-text" x="1122" y="916">3</text>
  <text class="body" x="1146" y="921">Time strip shows moments, not professional track complexity.</text>

  <text class="small" x="72" y="972">BLACK / WHITE / GRAYSCALE · NO FILE TREE · NO MODEL PICKER · NO EFFECT BROWSER · ADVANCED CONTROLS APPEAR ONLY WHEN NEEDED</text>
</svg>
